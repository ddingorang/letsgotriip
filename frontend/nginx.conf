# Triip 프론트엔드 리버스 프록시 (vite.config.js dev 프록시 미러링)
#
# 규칙 순서 주의: 더 구체적인 location 이 먼저 와야 한다.
#   /api/community → backend, '/api' prefix 제거 (BE는 /community 로 서빙)
#   /api/companion → backend, '/api' prefix 제거 (BE는 /companion 로 서빙)
#   /api/          → backend (prefix 유지: /api/attractions·/api/festivals·/api/plans·/api/recommendations·/api/chat)
#   /auth /users /uploads /oauth2 /login/oauth2 → backend
#   /ws            → backend (WebSocket 업그레이드, STOMP)
#   /              → SPA fallback (try_files)

upstream backend {
    server backend:9090;
}

server {
    listen 80;
    server_name _;

    # 업로드 이미지 등 대용량 바디 허용
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # 공통 프록시 헤더
    # Host 는 포트 포함($http_host) — OAuth redirect_uri 에 포트가 누락되지 않도록.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # ── /api/community → backend, '/api' prefix 제거 ──────────────────────────
    location /api/community {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend;
    }

    # ── /api/companion → backend, '/api' prefix 제거 ──────────────────────────
    location /api/companion {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend;
    }

    # ── /api/ → backend (prefix 유지) ─────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
    }

    # ── 인증/사용자/업로드/OAuth → backend ────────────────────────────────────
    location /auth/ {
        proxy_pass http://backend;
    }
    location /users/ {
        proxy_pass http://backend;
    }
    location /uploads/ {
        proxy_pass http://backend;
    }
    location /oauth2/ {
        proxy_pass http://backend;
    }
    location /login/oauth2/ {
        proxy_pass http://backend;
    }

    # ── /ws → backend (WebSocket / STOMP 업그레이드) ──────────────────────────
    location /ws {
        proxy_pass http://backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
