<!-- @dsCard group="Components" viewport="390x56" name="Navigation Bar" subtitle="상단 네비게이션 바 패턴" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--surface-bg); width: 390px; }
  .nav-bar {
    height: 52px; display: flex; align-items: center;
    padding: 0 16px; gap: 8px;
    background: var(--surface-bg);
    border-bottom: 1px solid var(--border-subtle);
  }
  .nav-btn {
    width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    border: none; background: none; cursor: pointer;
    color: var(--text-primary); border-radius: var(--radius-sm);
    flex-shrink: 0;
  }
  .nav-title {
    flex: 1; text-align: center;
    font: var(--weight-semibold) var(--text-lg)/1 var(--font-sans);
    color: var(--text-primary);
  }
  .nav-logo {
    flex: 1; font: var(--weight-extrabold) var(--text-xl)/1 var(--font-sans);
    color: var(--color-primary-500); letter-spacing: -0.02em;
  }
</style>
</head>
<body>
  <!-- Back + Title + Action -->
  <div class="nav-bar">
    <button class="nav-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="nav-title">여행 상세</div>
    <button class="nav-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    </button>
  </div>
</body>
</html>
