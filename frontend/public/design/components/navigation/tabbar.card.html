<!-- @dsCard group="Components" viewport="390x83" name="Tab Bar" subtitle="하단 탭 네비게이션 바" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--surface-bg); width: 390px; }
  .tab-bar {
    display: flex; align-items: flex-start;
    background: var(--surface-bg);
    border-top: 1px solid var(--border-subtle);
    padding: 10px 0 0;
    height: 83px;
  }
  .tab-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 4px; cursor: pointer;
    color: var(--text-tertiary); transition: color var(--duration-fast);
  }
  .tab-item.active { color: var(--color-primary-500); }
  .tab-icon { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }
  .tab-label { font: var(--weight-medium) 10px/1 var(--font-sans); }
  .tab-center {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
    margin-top: -18px;
  }
  .tab-center-btn {
    width: 52px; height: 52px; background: var(--color-primary-500);
    border-radius: var(--radius-full);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    box-shadow: 0 4px 12px rgba(255,98,0,0.35);
  }
  .tab-center-label { font: var(--weight-medium) 10px/1 var(--font-sans); color: var(--text-tertiary); margin-top: 4px; }
</style>
</head>
<body>
  <div class="tab-bar">
    <div class="tab-item active">
      <div class="tab-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div>
      <span class="tab-label">홈</span>
    </div>
    <div class="tab-item">
      <div class="tab-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div>
      <span class="tab-label">탐색</span>
    </div>
    <div class="tab-center">
      <div class="tab-center-btn">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
      <span class="tab-center-label">예약</span>
    </div>
    <div class="tab-item">
      <div class="tab-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
      <span class="tab-label">찜</span>
    </div>
    <div class="tab-item">
      <div class="tab-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
      <span class="tab-label">마이</span>
    </div>
  </div>
</body>
</html>
