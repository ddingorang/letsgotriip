<!-- @dsCard group="Components" viewport="700x340" name="Inputs & Forms" subtitle="텍스트 인풋, 선택, 날짜 등 폼 컨트롤" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: #fff; padding: 24px; }
  .section { margin-bottom: 20px; }
  .section-label { font: var(--weight-semibold) 11px/1 var(--font-sans); color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .col { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 6px; }
  label { font: var(--weight-medium) var(--text-sm)/1 var(--font-sans); color: var(--text-secondary); }
  .input-wrap { position: relative; }
  .input {
    width: 100%; height: 48px; padding: 0 14px;
    border: 1.5px solid var(--border-default);
    border-radius: var(--radius-sm);
    font: var(--type-body-lg); font-family: var(--font-sans);
    color: var(--text-primary);
    background: var(--surface-bg);
    outline: none;
    transition: border-color var(--duration-fast) var(--ease-default);
  }
  .input::placeholder { color: var(--text-tertiary); }
  .input:focus { border-color: var(--color-primary-500); }
  .input.error  { border-color: var(--color-error); }
  .input.filled { background: var(--surface-subtle); }
  .input-icon { padding-left: 42px; }
  .input-icon-wrap .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); pointer-events: none; }
  .helper { font: var(--type-caption); color: var(--text-tertiary); }
  .helper.error { color: var(--color-error); }
</style>
</head>
<body>
  <div class="section">
    <div class="section-label">States</div>
    <div class="row">
      <div class="col">
        <label>출발지</label>
        <input class="input" placeholder="어디서 출발하나요?">
        <span class="helper">도시명 또는 역명 입력</span>
      </div>
      <div class="col">
        <label>도착지 (Focus)</label>
        <input class="input" style="border-color:var(--color-primary-500)" placeholder="어디로 가나요?" value="부산역">
      </div>
      <div class="col">
        <label>날짜 (Error)</label>
        <input class="input error" type="text" value="2024-13-50">
        <span class="helper error">올바른 날짜를 입력하세요.</span>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="section-label">With Icon</div>
    <div class="row">
      <div class="col input-icon-wrap">
        <label>검색</label>
        <div class="input-wrap">
          <span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
          <input class="input input-icon" placeholder="목적지, 여행지 검색">
        </div>
      </div>
      <div class="col input-icon-wrap">
        <label>날짜 선택</label>
        <div class="input-wrap">
          <span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
          <input class="input input-icon" type="text" value="2026년 6월 15일">
        </div>
      </div>
    </div>
  </div>
  <div class="section" style="margin-bottom:0">
    <div class="section-label">Search Bar</div>
    <div style="background:var(--surface-subtle);border-radius:var(--radius-sm);display:flex;align-items:center;padding:0 14px;height:48px;gap:10px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <span style="font:var(--type-body);color:var(--text-tertiary)">여행지, 숙소, 교통편 검색</span>
    </div>
  </div>
</body>
</html>
