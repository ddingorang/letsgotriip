<!-- @dsCard group="Components" viewport="700x320" name="Buttons" subtitle="버튼 — 크기, 상태, 스타일 변형" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: #fff; padding: 24px; }
  .section { margin-bottom: 20px; }
  .section-label { font: var(--weight-semibold) 11px/1 var(--font-sans); color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
         border: none; cursor: pointer; font-family: var(--font-sans); font-weight: var(--weight-semibold);
         transition: opacity var(--duration-fast) var(--ease-default); }
  .btn:active { opacity: 0.75; }

  /* Variants */
  .btn-primary   { background: var(--color-primary-500); color: #fff; }
  .btn-secondary { background: var(--color-primary-50);  color: var(--color-primary-500); }
  .btn-outline   { background: transparent; color: var(--color-primary-500); border: 1.5px solid var(--color-primary-500); }
  .btn-ghost     { background: transparent; color: var(--text-primary); }
  .btn-danger    { background: var(--color-error); color: #fff; }
  .btn-disabled  { background: var(--color-neutral-200); color: var(--text-disabled); cursor: not-allowed; }

  /* Sizes */
  .btn-xl { height: 56px; padding: 0 28px; font-size: var(--text-lg); border-radius: var(--radius-md); }
  .btn-lg { height: 48px; padding: 0 24px; font-size: var(--text-base); border-radius: var(--radius-md); }
  .btn-md { height: 40px; padding: 0 18px; font-size: var(--text-base); border-radius: var(--radius-sm); }
  .btn-sm { height: 32px; padding: 0 12px; font-size: var(--text-sm); border-radius: var(--radius-sm); }
  .btn-xs { height: 26px; padding: 0 10px; font-size: var(--text-xs); border-radius: var(--radius-xs); }

  /* Full width */
  .btn-full { width: 100%; }
</style>
</head>
<body>
  <div class="section">
    <div class="section-label">Variant</div>
    <div class="row">
      <button class="btn btn-primary btn-lg">Primary</button>
      <button class="btn btn-secondary btn-lg">Secondary</button>
      <button class="btn btn-outline btn-lg">Outline</button>
      <button class="btn btn-ghost btn-lg">Ghost</button>
      <button class="btn btn-danger btn-lg">Danger</button>
      <button class="btn btn-disabled btn-lg" disabled>Disabled</button>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Size</div>
    <div class="row">
      <button class="btn btn-primary btn-xl">XL 예약하기</button>
      <button class="btn btn-primary btn-lg">LG 예약하기</button>
      <button class="btn btn-primary btn-md">MD 예약</button>
      <button class="btn btn-primary btn-sm">SM 선택</button>
      <button class="btn btn-primary btn-xs">XS 더보기</button>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Full Width</div>
    <button class="btn btn-primary btn-xl btn-full">지금 예약하기</button>
  </div>

  <div class="section" style="margin-bottom:0">
    <div class="section-label">With Icon</div>
    <div class="row">
      <button class="btn btn-primary btn-lg">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        다음으로
      </button>
      <button class="btn btn-outline btn-lg">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        검색
      </button>
      <button class="btn btn-secondary btn-lg">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        찜하기
      </button>
    </div>
  </div>
</body>
</html>
