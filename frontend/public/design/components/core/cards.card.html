<!-- @dsCard group="Components" viewport="700x360" name="Cards" subtitle="여행 카드, 예약 카드, 리스트 아이템" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--surface-subtle); padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .card {
    background: var(--surface-card); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm); overflow: hidden;
  }
  .card-img { width: 100%; height: 120px; object-fit: cover; display: block; }
  .card-img-placeholder { width: 100%; height: 120px; background: linear-gradient(135deg, var(--color-neutral-200) 25%, var(--color-neutral-100) 100%); display: flex; align-items: center; justify-content: center; }
  .card-body { padding: 12px; }
  .card-badge { display: inline-flex; align-items: center; font: var(--weight-semibold) 10px/1 var(--font-sans); background: var(--color-primary-50); color: var(--color-primary-600); padding: 3px 7px; border-radius: var(--radius-full); margin-bottom: 7px; }
  .card-title { font: var(--weight-semibold) var(--text-base)/var(--leading-snug) var(--font-sans); color: var(--text-primary); margin-bottom: 4px; }
  .card-sub   { font: var(--type-body-sm); color: var(--text-secondary); }
  .card-price { font: var(--weight-bold) var(--text-lg)/1 var(--font-sans); color: var(--color-primary-500); margin-top: 8px; }
  .card-price span { font: var(--weight-regular) var(--text-xs)/1 var(--font-sans); color: var(--text-tertiary); margin-left: 2px; }

  /* List item style */
  .list-item {
    background: var(--surface-card);
    border-radius: var(--radius-md);
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-xs);
  }
  .list-icon { width: 44px; height: 44px; border-radius: var(--radius-sm); background: var(--color-primary-50); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--color-primary-500); }
  .list-body { flex: 1; }
  .list-title { font: var(--weight-semibold) var(--text-base)/1 var(--font-sans); color: var(--text-primary); }
  .list-sub   { font: var(--type-body-sm); color: var(--text-secondary); margin-top: 3px; }
  .list-right { font: var(--weight-semibold) var(--text-base)/1 var(--font-sans); color: var(--color-primary-500); flex-shrink: 0; }
</style>
</head>
<body>
  <div class="grid" style="margin-bottom:14px">
    <div class="card">
      <div class="card-img-placeholder">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-neutral-400)" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      <div class="card-body">
        <div class="card-badge">추천</div>
        <div class="card-title">부산 해운대 리조트</div>
        <div class="card-sub">부산 해운대구 · ★ 4.8</div>
        <div class="card-price">₩180,000 <span>/ 박</span></div>
      </div>
    </div>
    <div class="card">
      <div class="card-img-placeholder">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-neutral-400)" stroke-width="1.5"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/></svg>
      </div>
      <div class="card-body">
        <div class="card-badge">인기</div>
        <div class="card-title">경주 역사 투어</div>
        <div class="card-sub">경북 경주시 · ★ 4.6</div>
        <div class="card-price">₩45,000 <span>/ 인</span></div>
      </div>
    </div>
    <div class="card">
      <div class="card-img-placeholder">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-neutral-400)" stroke-width="1.5"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
      </div>
      <div class="card-body">
        <div class="card-badge">새글</div>
        <div class="card-title">제주 올레길 3박4일</div>
        <div class="card-sub">제주 전역 · ★ 4.9</div>
        <div class="card-price">₩320,000 <span>/ 패키지</span></div>
      </div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <div class="list-item">
      <div class="list-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></div>
      <div class="list-body"><div class="list-title">서울 → 부산 KTX</div><div class="list-sub">06/15 09:00 출발 · 좌석 12A</div></div>
      <div class="list-right">₩59,800</div>
    </div>
    <div class="list-item">
      <div class="list-icon" style="background:var(--color-neutral-100);color:var(--text-secondary)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
      <div class="list-body"><div class="list-title">여행 일정 2일차</div><div class="list-sub">해운대 → 광안리 → 감천문화마을</div></div>
      <div class="list-right" style="color:var(--text-tertiary)">→</div>
    </div>
  </div>
</body>
</html>
