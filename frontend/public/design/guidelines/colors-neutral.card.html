<!-- @dsCard group="Colors" viewport="700x240" name="Neutral Scale" subtitle="Gray scale + surface tokens" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: #fff; padding: 20px; }
  .section-label { font: var(--weight-semibold) var(--text-sm)/1 var(--font-sans); color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
  .swatches { display: flex; gap: 6px; margin-bottom: 24px; }
  .swatch { flex: 1; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-subtle); }
  .swatch-block { height: 60px; }
  .swatch-info { padding: 6px 8px; background: var(--surface-subtle); }
  .swatch-name { font: var(--weight-medium) 10px/1 var(--font-sans); color: var(--text-secondary); }
  .swatch-val  { font: var(--weight-regular) 10px/1.4 var(--font-sans); color: var(--text-tertiary); }
</style>
</head>
<body>
  <div class="section-label">Neutrals</div>
  <div class="swatches">
    <div class="swatch"><div class="swatch-block" style="background:var(--color-neutral-0)"></div><div class="swatch-info"><div class="swatch-name">0</div><div class="swatch-val">#FFF</div></div></div>
    <div class="swatch"><div class="swatch-block" style="background:var(--color-neutral-50)"></div><div class="swatch-info"><div class="swatch-name">50</div><div class="swatch-val">#F8F8F8</div></div></div>
    <div class="swatch"><div class="swatch-block" style="background:var(--color-neutral-100)"></div><div class="swatch-info"><div class="swatch-name">100</div><div class="swatch-val">#F2F2F2</div></div></div>
    <div class="swatch"><div class="swatch-block" style="background:var(--color-neutral-200)"></div><div class="swatch-info"><div class="swatch-name">200</div><div class="swatch-val">#E6E6E6</div></div></div>
    <div class="swatch"><div class="swatch-block" style="background:var(--color-neutral-300)"></div><div class="swatch-info"><div class="swatch-name">300</div><div class="swatch-val">#CCC</div></div></div>
    <div class="swatch"><div class="swatch-block" style="background:var(--color-neutral-400)"></div><div class="swatch-info"><div class="swatch-name">400</div><div class="swatch-val">#AAA</div></div></div>
    <div class="swatch"><div class="swatch-block" style="background:var(--color-neutral-500)"></div><div class="swatch-info"><div class="swatch-name">500</div><div class="swatch-val">#888</div></div></div>
    <div class="swatch"><div class="swatch-block" style="background:var(--color-neutral-600)"></div><div class="swatch-info"><div class="swatch-name">600</div><div class="swatch-val">#666</div></div></div>
    <div class="swatch"><div class="swatch-block" style="background:var(--color-neutral-700)"></div><div class="swatch-info"><div class="swatch-name">700</div><div class="swatch-val">#444</div></div></div>
    <div class="swatch"><div class="swatch-block" style="background:var(--color-neutral-800)"></div><div class="swatch-info"><div class="swatch-name">800</div><div class="swatch-val">#2A2A2A</div></div></div>
    <div class="swatch"><div class="swatch-block" style="background:var(--color-neutral-900)"></div><div class="swatch-info"><div class="swatch-name">900</div><div class="swatch-val">#1A1A1A</div></div></div>
  </div>
</body>
</html>
