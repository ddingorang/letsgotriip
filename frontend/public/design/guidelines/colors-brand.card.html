<!-- @dsCard group="Colors" viewport="700x320" name="Brand Colors" subtitle="Primary orange scale" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: #fff; padding: 20px; }
  .section-label { font: var(--weight-semibold) var(--text-sm)/1 var(--font-sans); color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
  .swatches { display: flex; gap: 6px; margin-bottom: 24px; }
  .swatch { flex: 1; border-radius: var(--radius-sm); overflow: hidden; }
  .swatch-block { height: 60px; }
  .swatch-info { padding: 6px 8px; background: var(--surface-subtle); }
  .swatch-name { font: var(--weight-medium) 10px/1 var(--font-sans); color: var(--text-secondary); }
  .swatch-val  { font: var(--weight-regular) 10px/1.4 var(--font-sans); color: var(--text-tertiary); }
</style>
</head>
<body>
  <div class="section-label">Primary — Orange</div>
  <div class="swatches">
    <div class="swatch"><div class="swatch-block" style="background:var(--color-primary-50)"></div><div class="swatch-info"><div class="swatch-name">50</div><div class="swatch-val">#FEF4EC</div></div></div>
    <div class="swatch"><div class="swatch-block" style="background:var(--color-primary-100)"></div><div class="swatch-info"><div class="swatch-name">100</div><div class="swatch-val">#FDE5CF</div></div></div>
    <div class="swatch"><div class="swatch-block" style="background:var(--color-primary-200)"></div><div class="swatch-info"><div class="swatch-name">200</div><div class="swatch-val">#FBCBA0</div></div></div>
    <div class="swatch"><div class="swatch-block" style="background:var(--color-primary-300)"></div><div class="swatch-info"><div class="swatch-name">300</div><div class="swatch-val">#F9B070</div></div></div>
    <div class="swatch"><div class="swatch-block" style="background:var(--color-primary-400)"></div><div class="swatch-info"><div class="swatch-name">400</div><div class="swatch-val">#F89F63</div></div></div>
    <div class="swatch"><div class="swatch-block" style="background:var(--color-primary-500)"></div><div class="swatch-info"><div class="swatch-name">500 ★</div><div class="swatch-val">#F78F57</div></div></div>
    <div class="swatch"><div class="swatch-block" style="background:var(--color-primary-600)"></div><div class="swatch-info"><div class="swatch-name">600</div><div class="swatch-val">#D87A47</div></div></div>
    <div class="swatch"><div class="swatch-block" style="background:var(--color-primary-700)"></div><div class="swatch-info"><div class="swatch-name">700</div><div class="swatch-val">#B26338</div></div></div>
    <div class="swatch"><div class="swatch-block" style="background:var(--color-primary-800)"></div><div class="swatch-info"><div class="swatch-name">800</div><div class="swatch-val">#894C2A</div></div></div>
    <div class="swatch"><div class="swatch-block" style="background:var(--color-primary-900)"></div><div class="swatch-info"><div class="swatch-name">900</div><div class="swatch-val">#5A311B</div></div></div>
  </div>
  <div class="section-label">Semantic</div>
  <div class="swatches">
    <div class="swatch"><div class="swatch-block" style="background:var(--color-success)"></div><div class="swatch-info"><div class="swatch-name">Success</div><div class="swatch-val">#34C759</div></div></div>
    <div class="swatch"><div class="swatch-block" style="background:var(--color-warning)"></div><div class="swatch-info"><div class="swatch-name">Warning</div><div class="swatch-val">#FFCC00</div></div></div>
    <div class="swatch"><div class="swatch-block" style="background:var(--color-error)"></div><div class="swatch-info"><div class="swatch-name">Error</div><div class="swatch-val">#FF3B30</div></div></div>
    <div class="swatch"><div class="swatch-block" style="background:var(--color-info)"></div><div class="swatch-info"><div class="swatch-name">Info</div><div class="swatch-val">#007AFF</div></div></div>
  </div>
</body>
</html>
