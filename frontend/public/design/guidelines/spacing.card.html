<!-- @dsCard group="Spacing" viewport="700x360" name="Spacing Scale" subtitle="4px 베이스 스페이싱 토큰" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: #fff; padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar-wrap { width: 100%; display: flex; align-items: flex-end; justify-content: center; height: 80px; }
  .bar { background: var(--color-primary-400); border-radius: 3px 3px 0 0; width: 24px; }
  .label { font: var(--weight-medium) 11px/1 var(--font-sans); color: var(--text-secondary); }
  .val   { font: var(--weight-regular) 10px/1 var(--font-sans); color: var(--text-tertiary); }
  .divider { grid-column: 1/-1; height: 1px; background: var(--border-subtle); margin: 8px 0; }
  .radius-row { display: flex; gap: 16px; align-items: center; }
  .radius-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .radius-box { width: 48px; height: 48px; background: var(--color-primary-100); border: 2px solid var(--color-primary-300); }
  .section-label { font: var(--weight-semibold) var(--text-sm)/1 var(--font-sans); color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; margin-top: 20px; }
</style>
</head>
<body>
  <div class="section-label">Spacing</div>
  <div class="grid">
    <div class="item"><div class="bar-wrap"><div class="bar" style="height:4px"></div></div><div class="label">space-1</div><div class="val">4px</div></div>
    <div class="item"><div class="bar-wrap"><div class="bar" style="height:8px"></div></div><div class="label">space-2</div><div class="val">8px</div></div>
    <div class="item"><div class="bar-wrap"><div class="bar" style="height:12px"></div></div><div class="label">space-3</div><div class="val">12px</div></div>
    <div class="item"><div class="bar-wrap"><div class="bar" style="height:16px"></div></div><div class="label">space-4</div><div class="val">16px</div></div>
    <div class="item"><div class="bar-wrap"><div class="bar" style="height:20px"></div></div><div class="label">space-5</div><div class="val">20px</div></div>
    <div class="item"><div class="bar-wrap"><div class="bar" style="height:24px"></div></div><div class="label">space-6</div><div class="val">24px</div></div>
    <div class="item"><div class="bar-wrap"><div class="bar" style="height:32px"></div></div><div class="label">space-8</div><div class="val">32px</div></div>
    <div class="item"><div class="bar-wrap"><div class="bar" style="height:40px"></div></div><div class="label">space-10</div><div class="val">40px</div></div>
    <div class="item"><div class="bar-wrap"><div class="bar" style="height:48px"></div></div><div class="label">space-12</div><div class="val">48px</div></div>
    <div class="item"><div class="bar-wrap"><div class="bar" style="height:64px"></div></div><div class="label">space-16</div><div class="val">64px</div></div>
    <div class="item"><div class="bar-wrap"><div class="bar" style="height:80px"></div></div><div class="label">space-20</div><div class="val">80px</div></div>
  </div>
  <div class="section-label" style="margin-top:28px">Border Radius</div>
  <div class="radius-row">
    <div class="radius-item"><div class="radius-box" style="border-radius:var(--radius-xs)"></div><div class="label">xs — 4px</div></div>
    <div class="radius-item"><div class="radius-box" style="border-radius:var(--radius-sm)"></div><div class="label">sm — 8px</div></div>
    <div class="radius-item"><div class="radius-box" style="border-radius:var(--radius-md)"></div><div class="label">md — 12px</div></div>
    <div class="radius-item"><div class="radius-box" style="border-radius:var(--radius-lg)"></div><div class="label">lg — 16px</div></div>
    <div class="radius-item"><div class="radius-box" style="border-radius:var(--radius-xl)"></div><div class="label">xl — 20px</div></div>
    <div class="radius-item"><div class="radius-box" style="border-radius:var(--radius-2xl)"></div><div class="label">2xl — 24px</div></div>
    <div class="radius-item"><div class="radius-box" style="border-radius:var(--radius-full);width:48px;height:48px"></div><div class="label">full</div></div>
  </div>
</body>
</html>
