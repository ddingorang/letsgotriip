<!-- @dsCard group="App" viewport="390x844" name="체크리스트" subtitle="여행 준비 체크리스트 — 항목 추가·완료·알림" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390">
<link rel="stylesheet" href="../../styles.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: var(--font-sans); background: var(--surface-subtle); width: 390px; min-height: 844px; }
.status-bar { height: 54px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 20px 10px; background: #fff; }
.status-time { font: var(--weight-semibold) 15px/1 var(--font-sans); color: var(--text-primary); }
.status-icons { display: flex; gap: 6px; }
.nav-bar { height: 52px; display: flex; align-items: center; padding: 0 16px; gap: 8px; background: #fff; border-bottom: 1px solid var(--border-subtle); }
.nav-back { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: var(--text-primary); cursor: pointer; }
.nav-title { flex: 1; text-align: center; font: var(--weight-semibold) var(--text-lg)/1 var(--font-sans); color: var(--text-primary); }
.nav-more { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); cursor: pointer; }

/* TRIP BANNER */
.trip-banner { background: var(--color-primary-500); padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
.trip-icon { width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.trip-name { font: var(--weight-bold) var(--text-base)/1 var(--font-sans); color: #fff; margin-bottom: 3px; }
.trip-date { font: var(--weight-medium) var(--text-xs)/1 var(--font-sans); color: rgba(255,255,255,0.75); }
.trip-dday { margin-left: auto; background: rgba(255,255,255,0.2); border-radius: var(--radius-full); padding: 5px 12px; font: var(--weight-bold) var(--text-sm)/1 var(--font-sans); color: #fff; flex-shrink: 0; }

/* PROGRESS */
.progress-section { background: #fff; padding: 16px 20px; border-bottom: 1px solid var(--border-subtle); }
.progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.progress-label { font: var(--weight-semibold) var(--text-base)/1 var(--font-sans); color: var(--text-primary); }
.progress-count { font: var(--weight-bold) var(--text-sm)/1 var(--font-sans); color: var(--color-primary-500); }
.progress-bar { height: 8px; background: var(--surface-subtle); border-radius: var(--radius-full); overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--color-primary-400), #F9A96A); border-radius: var(--radius-full); transition: width 0.4s; }
.progress-sub { display: flex; gap: 12px; margin-top: 10px; }
.progress-sub-item { display: flex; align-items: center; gap: 5px; font: var(--weight-medium) var(--text-xs)/1 var(--font-sans); color: var(--text-secondary); }
.progress-dot { width: 8px; height: 8px; border-radius: 50%; }

/* TEMPLATE CHIPS */
.template-section { padding: 14px 20px; background: #fff; border-bottom: 1px solid var(--border-subtle); }
.template-label { font: var(--weight-medium) var(--text-xs)/1 var(--font-sans); color: var(--text-tertiary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.06em; }
.template-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.template-chips::-webkit-scrollbar { display: none; }
.template-chip { flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: var(--radius-full); font: var(--weight-medium) var(--text-xs)/1 var(--font-sans); background: var(--surface-subtle); color: var(--text-secondary); border: 1.5px solid var(--border-default); cursor: pointer; white-space: nowrap; }
.template-chip svg { color: var(--color-primary-500); }

/* CHECKLIST */
.checklist { padding: 16px 20px 120px; display: flex; flex-direction: column; gap: 16px; }
.checklist-group { background: var(--surface-bg); border-radius: var(--radius-lg); overflow: hidden; }
.group-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border-subtle); cursor: pointer; }
.group-icon { width: 30px; height: 30px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.group-title { flex: 1; font: var(--weight-bold) var(--text-sm)/1 var(--font-sans); color: var(--text-primary); }
.group-count { font: var(--weight-medium) var(--text-xs)/1 var(--font-sans); color: var(--text-tertiary); }
.group-chevron { color: var(--text-tertiary); transition: transform 0.2s; }

.check-item { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--border-subtle); }
.check-item:last-child { border-bottom: none; }
.checkbox { width: 22px; height: 22px; border-radius: var(--radius-xs); border: 2px solid var(--border-strong); display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; transition: all var(--duration-fast); }
.checkbox.checked { background: var(--color-primary-500); border-color: var(--color-primary-500); }
.check-text { flex: 1; font: var(--weight-medium) var(--text-sm)/1 var(--font-sans); color: var(--text-primary); }
.check-text.done { text-decoration: line-through; color: var(--text-tertiary); }
.check-link { font: var(--weight-medium) var(--text-xs)/1 var(--font-sans); color: var(--color-primary-500); flex-shrink: 0; }
.check-alarm { color: var(--text-tertiary); flex-shrink: 0; }
.check-alarm.set { color: var(--color-primary-500); }
.add-item-btn { display: flex; align-items: center; gap: 8px; padding: 12px 16px; color: var(--color-primary-500); font: var(--weight-semibold) var(--text-sm)/1 var(--font-sans); cursor: pointer; }

/* BOTTOM */
.bottom-bar { position: fixed; bottom: 0; left: 0; width: 390px; background: var(--surface-bg); border-top: 1px solid var(--border-subtle); padding: 14px 20px 34px; display: flex; gap: 10px; }
.btn-add { flex: 1; height: 52px; background: var(--color-primary-500); color: #fff; border: none; border-radius: var(--radius-md); font: var(--weight-bold) var(--text-base)/1 var(--font-sans); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-outline { height: 52px; padding: 0 18px; background: transparent; color: var(--text-secondary); border: 1.5px solid var(--border-default); border-radius: var(--radius-md); font: var(--weight-semibold) var(--text-sm)/1 var(--font-sans); cursor: pointer; white-space: nowrap; }
</style>
</head>
<body>
<div class="status-bar"><span class="status-time">9:41</span><div class="status-icons"><svg width="17" height="12" viewBox="0 0 17 12" fill="var(--text-primary)"><rect x="0" y="4" width="3" height="8" rx="1"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1"/><rect x="9" y="1" width="3" height="11" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg></div></div>
<div class="nav-bar">

  <div class="nav-title">여행 체크리스트</div>
  <div class="nav-more"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg></div>
</div>

<div class="trip-banner">
  <div class="trip-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg></div>
  <div>
    <div class="trip-name">부산 2박 3일 여행</div>

<div class="progress-section">
  <div class="progress-header">
    <div class="progress-label">전체 준비 현황</div>
    <div class="progress-count">11/18 완료</div>

    <div class="progress-sub-item"><div class="progress-dot" style="background:var(--border-strong)"></div>미완료 7개</div>
    <div class="progress-sub-item"><div class="progress-dot" style="background:var(--color-error)"></div>긴급 2개</div>

<div class="template-section">

    <div class="template-chip"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>보조배터리</div>
    <div class="template-chip"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>상비약</div>
    <div class="template-chip"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>선크림</div>
    <div class="template-chip"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>우산</div>
  </div>
</div>

<div class="checklist">

      <div class="group-icon" style="background:var(--color-primary-50)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary-500)" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></div>

    </div>
    <div class="check-item">

    </div>
    <div class="check-item">

      <div class="check-text done">숙소 예약 (해운대 오션뷰)</div>
      <div class="check-link">예약 확인</div>
    </div>

      <div class="checkbox checked"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="check-text done">귀환 KTX 예약</div>
      <div class="check-link">예약 확인</div>
    </div>
  </div>

  <!-- 필수 지참물 -->
  <div class="checklist-group">
    <div class="group-header">
      <div class="group-icon" style="background:#FFF3E0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E65100" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></div>
      <div class="group-title">필수 지참물</div>
      <div class="group-count">4/6 완료</div>
      <svg class="group-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="check-item">
      <div class="checkbox checked"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="check-text done">신분증</div>

    </div>
    <div class="check-item">

    </div>
    <div class="check-item">
