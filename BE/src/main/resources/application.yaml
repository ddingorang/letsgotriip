# Created: 2026-06-08 15:35:28
spring:
  application:
    name: trip

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # 구글 콘솔에 등록된 '이전' redirect_uri 로 고정(기본 :9090 — 원래 dev 셋업 값).
            # 콘솔 등록값이 다르면 OAUTH_REDIRECT_URI 환경변수로 교체.
            redirect-uri: "${OAUTH_REDIRECT_URI:http://localhost:9090/login/oauth2/code/google}"
            scope:
              - email
              - profile

  # MySQL
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/trip_chat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    show-sql: true

  data:
    # MongoDB
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/trip_chat}
    # Redis
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379

  # RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}        # AMQP 포트
    stomp:
      port: ${RABBITMQ_STOMP_PORT:61613}     # STOMP 포트
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  # Spring Batch
  batch:
    job:
      enabled: false          # 앱 시작 시 자동 실행 방지
    jdbc:
      initialize-schema: always  # 배치 메타 테이블 자동 생성

  # Spring AI (SSAFY GMS — OpenAI 호환 프록시)
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://gms.ssafy.io/gmsapi/api.openai.com/v1/
      chat:
        completions-path: chat/completions
        options:
          model: gpt-4o-mini

# RabbitMQ Queue / Exchange / Routing Key
rabbitmq:
  queue:
    name: chat.queue
  exchange:
    name: chat.exchange
  routing:
    key: chat.routing.key

# JWT
jwt:
  secret: ${JWT_SECRET}
  accesstoken-expiration-time: 3600     # 1시간 (초)
  overlap-window: PT5M                  # 5분
  refresh-ttl: P7D                      # 7일

server:
  port: 9090

# 채팅(WebSocket/RabbitMQ) 조건부 기동 — false면 RabbitMQ 없이 부팅 가능
chat:
  enabled: ${CHAT_ENABLED:true}

# 프론트엔드 (OAuth 콜백 리다이렉트)
app:
  frontend:
    oauth-callback-url: ${FE_OAUTH_CALLBACK_URL:http://localhost:5173/oauth/callback}
    login-url: ${FE_LOGIN_URL:http://localhost:5173/login}
    # CORS 허용 Origin — WebConfig.corsConfigurationSource()가 사용. 운영은 FE_ALLOWED_ORIGINS로 도메인 지정
    allowed-origins: ${FE_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  # 인증 쿠키 Secure 플래그 — 운영(HTTPS) 기본 true, 로컬 개발은 false
  cookie:
    secure: ${COOKIE_SECURE:false}
  upload:
    dir: ${UPLOAD_DIR:uploads/community}
    url-prefix: ${UPLOAD_URL_PREFIX:/uploads/community}
    base-dir: ${UPLOAD_BASE_DIR:uploads}
  # 데모 데이터 시드 토글 — DataSeeder(@ConditionalOnProperty)가 사용
  seed:
    enabled: ${SEED_ENABLED:true}

# OpenAI (Whisper STT — preprocessing 도메인)
openai:
  api:
    key: ${OPENAI_API_KEY}
    url: https://gms.ssafy.io/gmsapi/api.openai.com/v1/audio/transcriptions

# 한국관광공사 API
tour:
  api:
    base-url: https://apis.data.go.kr/B551011/KorService2
    key: ${TOUR_API_KEY}
