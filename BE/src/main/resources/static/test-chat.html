<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>채팅 테스트</title>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; }
        input, button { margin: 5px; padding: 8px; }
        #messages { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; margin-top: 10px; }
    </style>
</head>
<body>

<h3>1. JWT 토큰 입력</h3>
<input id="token" type="text" placeholder="Bearer eyJ..." size="80">
<button onclick="connect()">연결</button>
<div id="status">연결 안됨</div>

<h3>2. 구독</h3>
<input id="roomId" type="text" placeholder="채팅방 ID (예: 1)" value="1">
<button onclick="subscribe()">구독</button>

<h3>3. 메시지 전송</h3>
<input id="content" type="text" placeholder="메시지 내용" size="50">
<select id="messageType">
    <option value="TEXT">TEXT</option>
    <option value="IMAGE">IMAGE</option>
</select>
<button onclick="sendMessage()">전송</button>

<h3>수신 메시지</h3>
<div id="messages"></div>

<script>
    let stompClient = null;

    function connect() {
        const token = document.getElementById('token').value;
        const socket = new WebSocket('ws://localhost:9090/ws');
        stompClient = Stomp.over(socket);

        stompClient.connect(
            { Authorization: token },
            () => {
                document.getElementById('status').innerText = '✅ 연결 성공';
                document.getElementById('status').style.color = 'green';
            },
            (error) => {
                document.getElementById('status').innerText = '❌ 연결 실패: ' + error;
                document.getElementById('status').style.color = 'red';
            }
        );
    }

    function subscribe() {
        const roomId = document.getElementById('roomId').value;
        stompClient.subscribe(`/topic/chat.room.${roomId}`, (message) => {
            const body = JSON.parse(message.body);
            const div = document.createElement('div');
            div.innerText = `[${body.timestamp}] ${body.senderId}: ${body.content}`;
            document.getElementById('messages').appendChild(div);
        });
        alert(`/topic/chat.room.${roomId} 구독 완료`);
    }

    function sendMessage() {
        const roomId = document.getElementById('roomId').value;
        const content = document.getElementById('content').value;
        const messageType = document.getElementById('messageType').value;

        stompClient.send(`/pub/chat.message.${roomId}`, {}, JSON.stringify({
            chatRoomId: parseInt(roomId),
            messageType: messageType,
            content: content,
            correlationId: crypto.randomUUID()
        }));
    }
</script>
</body>
</html>
